name: Deploy to GitHub Pages

# Every push to main publishes the app at https://<owner>.github.io/<repo>/
# (Settings → Pages → Source must be "GitHub Actions").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build for the Pages sub-path
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Cloudflare Web Analytics site token (public), from Settings → Secrets and variables
          # → Actions → Variables. Forks don't inherit it, so their copies ship no analytics.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - name: Check SEO files and analytics beacon
        run: |
          for f in robots.txt sitemap.xml social-preview.jpg apple-touch-icon.png; do test -s "dist/$f"; done
          n=$( (grep -o 'static.cloudflareinsights.com/beacon.min.js' dist/index.html || true) | wc -l)
          echo "Cloudflare beacon tags: $n"
          if [ -n "$CF_BEACON_TOKEN" ]; then [ "$n" -eq 1 ]; else [ "$n" -eq 0 ]; fi
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
